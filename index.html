<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tu avatar · Día de Ingeniería en Multimedia</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f6e7d0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    /* Paleta tomada del póster Multifest */
    --cream: #f6e7d0;
    --cream-deep: #ecd8b8;
    --forest: #0c3732;
    --forest-soft: #14504a;
    --coral: #f29a8a;
    --coral-press: #e8836f;
    --red: #d9503f;
    --mustard: #f2b544;
    --sage: #e8e3a8;
    --muted: #4b5f58;
    --warn: #a3321f;
    --display: "Anton", "Impact", "Arial Narrow", sans-serif;
    --body: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
    --shadow: 5px 5px 0 var(--forest);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--cream);
    color: var(--forest);
    font-family: var(--body);
    font-size: 1rem;
    line-height: 1.5;
    padding: max(1.25rem, env(safe-area-inset-top)) 1.25rem max(2rem, env(safe-area-inset-bottom));
    display: flex;
    justify-content: center;
  }
  main { width: 100%; max-width: 26rem; display: flex; flex-direction: column; gap: 1.25rem; }

  /* Cabecera: etiqueta del evento + franjas del póster */
  .top { display: grid; gap: .6rem; }
  .event {
    margin: 0;
    display: flex; align-items: center; gap: .5rem;
    font-size: .8125rem; font-weight: 800;
    letter-spacing: .08em; text-transform: uppercase;
    color: var(--forest);
  }
  .event svg { width: 1.1rem; height: 1.1rem; flex: none; }
  .stripes { display: grid; gap: 3px; }
  .stripes i { display: block; height: 5px; }
  .stripes i:nth-child(1) { background: var(--forest-soft); }
  .stripes i:nth-child(2) { background: var(--coral); }
  .stripes i:nth-child(3) { background: var(--forest-soft); }
  .stripes i:nth-child(4) { background: var(--red); }

  /* Escenario del avatar */
  .stage {
    position: relative;
    background: var(--forest);
    border: 3px solid var(--forest);
    border-radius: .5rem;
    padding: .75rem;
    box-shadow: var(--shadow);
  }
  .stage::before, .stage::after {
    content: ""; position: absolute; pointer-events: none; z-index: 2;
  }
  /* Estrella de 8 puntas (coral) y estrella con borde (mostaza) */
  .stage::before {
    width: 2.75rem; height: 2.75rem; top: -1.25rem; left: -1rem;
    background: var(--coral);
    clip-path: polygon(50% 0, 58% 36%, 100% 50%, 58% 64%, 50% 100%, 42% 64%, 0 50%, 42% 36%);
  }
  .stage::after {
    width: 2.25rem; height: 2.25rem; top: -.9rem; right: -.6rem;
    background: var(--mustard);
    clip-path: polygon(50% 0, 62% 35%, 98% 38%, 69% 59%, 79% 95%, 50% 74%, 21% 95%, 31% 59%, 2% 38%, 38% 35%);
  }
  .stage img {
    display: none;
    width: 100%;
    height: auto;          /* respeta la proporción real: nunca recorta */
    border-radius: .25rem;
    background: var(--cream);
  }
  .stage.ready img { display: block; }
  .placeholder {
    min-height: 19rem;
    display: grid; align-content: center; justify-items: center; gap: 1rem;
    padding: 1.5rem; text-align: center;
    color: var(--cream);
  }
  .stage.ready .placeholder { display: none; }
  .dots { display: flex; gap: .5rem; }
  .dots span {
    width: .8rem; height: .8rem; border-radius: 50%;
    background: var(--coral);
    animation: pulse 1.2s ease-in-out infinite;
  }
  .dots span:nth-child(2) { animation-delay: .15s; background: var(--mustard); }
  .dots span:nth-child(3) { animation-delay: .3s; background: var(--sage); }
  @keyframes pulse { 0%, 80%, 100% { opacity: .25; transform: scale(.8); } 40% { opacity: 1; transform: scale(1); } }
  .placeholder strong {
    font-family: var(--display); font-weight: 400;
    font-size: 1.75rem; line-height: 1.1; letter-spacing: .02em; text-transform: uppercase;
  }
  .placeholder p { margin: 0; color: var(--sage); max-width: 18rem; }

  /* Título */
  .heading { display: grid; gap: .4rem; }
  h1 {
    margin: 0;
    font-family: var(--display);
    font-weight: 400;
    text-transform: uppercase;
    font-size: clamp(2.5rem, 13vw, 3.5rem);
    line-height: .98;
    letter-spacing: .01em;
    color: var(--forest);
    overflow-wrap: anywhere;
  }
  .lead {
    margin: 0;
    display: inline-block; justify-self: start;
    padding: .3rem .7rem;
    background: var(--forest); color: var(--sage);
    font-size: .9375rem; font-weight: 600;
    border-radius: .25rem;
  }
  .lead:empty { display: none; }

  /* Reproductor */
  .player {
    background: var(--cream);
    border: 3px solid var(--forest);
    border-radius: .5rem;
    padding: 1rem 1rem .85rem;
    box-shadow: var(--shadow);
    display: none;
  }
  .player.ready { display: block; }
  .player label {
    display: block; margin-bottom: .6rem;
    font-family: var(--display); font-weight: 400;
    font-size: 1.25rem; letter-spacing: .04em; text-transform: uppercase;
  }
  audio { width: 100%; height: 2.75rem; border-radius: 2rem; }
  .bars { display: flex; align-items: flex-end; gap: 3px; height: 2.25rem; margin-bottom: .75rem; }
  .bars i {
    flex: 1; border-radius: 2px; background: var(--forest);
    height: 20%; opacity: .3;
    transition: height .2s ease, opacity .2s ease;
  }
  .bars i:nth-child(3n+1) { background: var(--coral); }
  .bars i:nth-child(5n) { background: var(--mustard); }
  .player.playing .bars i { opacity: 1; animation: bar 900ms ease-in-out infinite; }
  @keyframes bar { 0%, 100% { height: 20%; } 50% { height: 100%; } }

  /* Botones */
  .actions { display: grid; gap: .9rem; }
  .btn {
    appearance: none;
    border: 3px solid var(--forest);
    border-radius: .5rem;
    min-height: 3.5rem;
    padding: .75rem 1.25rem;
    font: 800 1.0625rem/1.2 var(--body);
    letter-spacing: .06em; text-transform: uppercase;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: .6rem;
    background: var(--coral);
    color: var(--forest);
    box-shadow: var(--shadow);
    transition: transform .1s ease, box-shadow .1s ease, background .15s ease;
  }
  .btn:hover { background: var(--coral-press); }
  .btn:active { transform: translate(4px, 4px); box-shadow: 1px 1px 0 var(--forest); }
  .btn.secondary { background: var(--mustard); }
  .btn.secondary:hover { background: #e5a630; }
  .btn[disabled] {
    background: var(--cream-deep); color: var(--muted);
    border-color: #b9a888; box-shadow: 5px 5px 0 #b9a888;
    cursor: not-allowed;
  }
  .btn[disabled]:active { transform: none; box-shadow: 5px 5px 0 #b9a888; }
  .btn:focus-visible, audio:focus-visible { outline: 3px solid var(--red); outline-offset: 3px; }
  .btn svg { width: 1.3rem; height: 1.3rem; flex: none; }

  .status { margin: 0; font-size: .9375rem; font-weight: 500; color: var(--muted); min-height: 1.5rem; }
  .status.warn { color: var(--warn); font-weight: 700; }

  .foot {
    margin: .25rem 0 0; text-align: center;
    font-size: .75rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
    color: var(--muted);
  }

  @media (prefers-reduced-motion: reduce) {
    .dots span, .player.playing .bars i { animation: none; }
    .dots span { opacity: 1; }
    .player.playing .bars i { height: 60%; }
    .btn { transition: none; }
  }
</style>
</head>
<body>
<main>
  <header class="top">
    <p class="event">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#f2b544" stroke="#0c3732" stroke-width="1.5" stroke-linejoin="round" d="M14 2 5 13h6l-1 9 9-11h-6z"/></svg>
      Día de Ingeniería en Multimedia
    </p>
    <div class="stripes" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  </header>

  <div class="stage" id="stage">
    <img id="avatarImg" alt="">
    <div class="placeholder" id="placeholder">
      <div class="dots" aria-hidden="true"><span></span><span></span><span></span></div>
      <strong id="phTitle">Estamos preparando tu avatar</strong>
      <p id="phText">Esta página se actualiza sola. No hace falta que escanees de nuevo.</p>
    </div>
  </div>

  <div class="heading">
    <h1 id="title">Tu avatar</h1>
    <p class="lead" id="lead"></p>
  </div>

  <section class="player" id="player" aria-label="Sonido de tu avatar">
    <label for="audio">Escucha tu sonido</label>
    <div class="bars" aria-hidden="true"></div>
    <audio id="audio" controls preload="none"></audio>
  </section>

  <div class="actions">
    <button class="btn" id="dlImage" type="button" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0 4.5-4.5M12 15 7.5 10.5M4 20h16"/></svg>
      Descargar imagen
    </button>
    <button class="btn secondary" id="dlAudio" type="button" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0 4.5-4.5M12 15 7.5 10.5M4 20h16"/></svg>
      Descargar audio
    </button>
  </div>

  <p class="status" id="status" role="status" aria-live="polite"></p>
  <p class="foot">Multifest · Universidad Militar Nueva Granada</p>
</main>

<script>
(function () {
  "use strict";

  /* ===== CONFIGURACIÓN: ajustar a tu proyecto de Supabase ===== */
  var CONFIG = {
    // URL base del proyecto, sin barra final. Ej: "https://abcdxyz.supabase.co"
    SUPABASE_URL: "https://ywnbijwhukywommjqdxw.supabase.co",
    // Bucket PÚBLICO donde ya subes el .wav
    BUCKET: "Leitmotivs",
    // Ruta de cada archivo dentro del bucket. {id} se reemplaza por el guid del avatar.
    IMAGE_PATH: "{id}.png",
    AUDIO_PATH: "{id}.wav",
    // Cada cuánto se revisa si los archivos ya existen (ms). Pasados 5 min se espacia.
    POLL_FAST_MS: 4000,
    POLL_SLOW_MS: 15000,
    SLOW_AFTER_MS: 5 * 60 * 1000,
    // Tras este tiempo sin archivos, se avisa que está tardando más de lo normal.
    DELAY_NOTICE_MS: 3 * 60 * 1000
  };
  /* ============================================================ */

  var $ = function (id) { return document.getElementById(id); };
  var UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

  var params = new URLSearchParams(location.search);
  var id = (params.get("id") || "").trim();
  var name = (params.get("n") || "").trim().slice(0, 40);
  // i=0: este avatar no tiene imagen (por ahora solo audio). No se espera ni se muestra.
  var noImage = params.get("i") === "0";

  var stage = $("stage"), img = $("avatarImg"), player = $("player"), audio = $("audio");
  var btnImg = $("dlImage"), btnAud = $("dlAudio"), statusEl = $("status");
  if (noImage) { stage.style.display = "none"; btnImg.style.display = "none"; }

  // Barras decorativas del reproductor
  var bars = document.querySelector(".bars");
  for (var i = 0; i < 24; i++) {
    var b = document.createElement("i");
    b.style.animationDelay = ((i * 83) % 900) + "ms";
    bars.appendChild(b);
  }

  function setStatus(text, warn) {
    statusEl.textContent = text || "";
    statusEl.classList.toggle("warn", !!warn);
  }

  function fileUrl(template) {
    return CONFIG.SUPABASE_URL + "/storage/v1/object/public/" +
      encodeURIComponent(CONFIG.BUCKET) + "/" + template.replace("{id}", id);
  }
  var imageUrl, audioUrl;

  function fileSafe(s) {
    return (s || "avatar").normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-zA-Z0-9_-]+/g, "_").replace(/^_+|_+$/g, "") || "avatar";
  }

  // ---- Enlace inválido ----
  if (!UUID_RE.test(id) || CONFIG.SUPABASE_URL.indexOf("TU-PROYECTO") !== -1) {
    $("phTitle").textContent = UUID_RE.test(id) ? "Página sin configurar" : "Este enlace no es válido";
    $("phText").textContent = UUID_RE.test(id)
      ? "Falta indicar la URL de Supabase y el bucket en la configuración de la página."
      : "Escanea de nuevo el código QR que aparece en la pantalla.";
    document.querySelector(".dots").style.display = "none";
    $("title").textContent = "";
    return;
  }

  imageUrl = fileUrl(CONFIG.IMAGE_PATH);
  audioUrl = fileUrl(CONFIG.AUDIO_PATH);
  if (name) { $("title").textContent = name; document.title = name + " · Tu avatar"; }
  $("lead").textContent = noImage ? "Estamos terminando de guardar tu sonido." : "Estamos terminando de guardar tu avatar.";

  var imageReady = false, audioReady = false, startedAt = Date.now();

  function exists(url) {
    // HEAD sin caché: el archivo puede aparecer en cualquier momento.
    return fetch(url, { method: "HEAD", cache: "no-store" })
      .then(function (r) { return r.ok; })
      .catch(function () { return false; });
  }

  function markImageReady() {
    imageReady = true;
    img.onload = function () { stage.classList.add("ready"); };
    img.alt = name ? "Avatar de " + name : "Tu avatar";
    img.src = imageUrl + "?v=" + Date.now();
    btnImg.disabled = false;
  }
  function markAudioReady() {
    audioReady = true;
    audio.src = audioUrl;
    player.classList.add("ready");
    btnAud.disabled = false;
  }
  function refreshCopy() {
    if ((noImage || imageReady) && audioReady) {
      $("lead").textContent = noImage ? "Tu sonido está listo." : "Tu avatar y su sonido están listos.";
      setStatus("");
    } else if (imageReady || audioReady) {
      $("lead").textContent = "Ya puedes descargar una parte. La otra llega en un momento.";
    }
  }

  function tick() {
    var elapsed = Date.now() - startedAt;
    var jobs = [];
    if (!noImage && !imageReady) jobs.push(exists(imageUrl).then(function (ok) { if (ok) markImageReady(); }));
    if (!audioReady) jobs.push(exists(audioUrl).then(function (ok) { if (ok) markAudioReady(); }));
    Promise.all(jobs).then(function () {
      refreshCopy();
      if ((noImage || imageReady) && audioReady) return;
      if (elapsed > CONFIG.DELAY_NOTICE_MS) {
        setStatus("Está tardando más de lo normal. Puedes dejar esta página abierta o volver a escanear en unos minutos.", true);
      }
      setTimeout(tick, elapsed > CONFIG.SLOW_AFTER_MS ? CONFIG.POLL_SLOW_MS : CONFIG.POLL_FAST_MS);
    });
  }
  tick();

  // ---- Reproductor ----
  audio.addEventListener("play", function () { player.classList.add("playing"); });
  audio.addEventListener("pause", function () { player.classList.remove("playing"); });
  audio.addEventListener("ended", function () { player.classList.remove("playing"); });

  // ---- Descargas ----
  // El atributo "download" se ignora entre dominios distintos, así que se baja como blob.
  function download(url, filename, button, label) {
    button.disabled = true;
    setStatus("Descargando…");
    fetch(url, { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("http " + r.status); return r.blob(); })
      .then(function (blob) {
        var a = document.createElement("a");
        var objUrl = URL.createObjectURL(blob);
        a.href = objUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function () { URL.revokeObjectURL(objUrl); }, 4000);
        setStatus(label + " descargado. Revisa tu carpeta de descargas.");
      })
      .catch(function () {
        // Plan B: abrir el archivo en otra pestaña para guardarlo desde ahí.
        window.open(url, "_blank", "noopener");
        setStatus("No se pudo descargar directo. Se abrió el archivo en otra pestaña: mantén presionado para guardarlo.", true);
      })
      .then(function () { button.disabled = false; });
  }

  var base = fileSafe(name);
  btnImg.addEventListener("click", function () {
    download(imageUrl, "avatar-" + base + ".png", btnImg, "La imagen");
  });
  btnAud.addEventListener("click", function () {
    download(audioUrl, "sonido-" + base + ".wav", btnAud, "El audio");
  });
})();
</script>
</body>
</html>
